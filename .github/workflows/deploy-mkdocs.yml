name: Deploy MkDocs site

# Allow the workflow to push to the repository (needed for gh-pages deployment)
permissions:
  contents: write

on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material

      - name: Build site
        run: mkdocs build --strict

      - name: Copy static site folders into site/
        run: |
          set -euo pipefail
          echo "Copying static folders with index.html into site/"
          # iterate top-level directories
          for d in ./*/; do
            [ -d "$d" ] || continue
            dn=$(basename "$d")
            case "$dn" in
              .git|node_modules|.github|.vscode|dist|scripts|docs) continue ;;
            esac
            if [ -f "$d/index.html" ] || [ -f "$d/index.htm" ]; then
              echo "- copying $dn to site/$dn"
              mkdir -p "site/$dn"
              rsync -a "$d" "site/$dn/"
            else
              echo "- skipping $dn (no index.html)"
            fi
          done

      - name: Debug: list site/ and show index files
        run: |
          echo '=== site/ tree ==='
          ls -la site || true
          echo '=== head of site/index.html (if exists) ==='
          if [ -f site/index.html ]; then
            sed -n '1,120p' site/index.html || true
          else
            echo '(no site/index.html)'
          fi
          echo '=== head of site/<folders>/index.html (examples) ==='
          for f in site/*; do
            if [ -d "$f" ] && [ -f "$f/index.html" ]; then
              echo "--- $f/index.html ---"
              sed -n '1,40p' "$f/index.html" || true
            fi
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          clean: true
